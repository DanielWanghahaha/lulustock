[project]
name = "stock-agent"
version = "0.1.0"
description = "投资管家 · 股票助手 Agent（Telegram + MySQL）"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]~=22.0",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]
